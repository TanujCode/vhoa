<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo SVG Test</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px;
      background: #f1f5f9;
    }
    .container {
      padding: 30px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .light {
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .dark {
      background: #0A2240; /* Same as the AuthLayout dark background */
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      color: #ffffff;
    }
    .logo-svg {
      height: 64px;
      width: auto;
    }
  </style>
</head>
<body>

  <h2>Logo SVG Implementation Test</h2>

  <div class="container light">
    <h3>Light Background</h3>
    <!-- SVG Logo (Light Version) -->
    <svg class="logo-svg" viewBox="0 0 228 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Dynamic gradient for E roof and bars -->
        <linearGradient id="nb_g_light" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5BA4F5" />
          <stop offset="100%" stop-color="#1D68DF" />
        </linearGradient>
      </defs>

      <!-- N -->
      <text x="3" y="46" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" textLength="26" lengthAdjust="spacingAndGlyphs" fill="#0F172A">N</text>

      <!-- E (House icon) with drop shadow -->
      <g style="filter: drop-shadow(0px 2.5px 2px rgba(15, 23, 42, 0.25));">
        <!-- Roof triangle -->
        <path d="M33 21 L47 4 L61 21 Z" fill="url(#nb_g_light)" />
        <!-- Window panes -->
        <rect x="44" y="10" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="48.5" y="10" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="44" y="14.5" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="48.5" y="14.5" width="3" height="3" rx="0.5" fill="#ffffff" />
      </g>

      <!-- 3 bars (E body) -->
      <rect x="33" y="24" width="28" height="5" rx="2.5" fill="url(#nb_g_light)" />
      <rect x="33" y="32" width="28" height="5" rx="2.5" fill="url(#nb_g_light)" />
      <rect x="33" y="40" width="28" height="5" rx="2.5" fill="url(#nb_g_light)" />

      <!-- STBL -->
      <text x="65" y="46" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" textLength="90" lengthAdjust="spacingAndGlyphs" fill="#0F172A">STBL</text>

      <!-- OQ Overlap & Shadows -->
      <!-- O circle -->
      <circle cx="169" cy="33" r="13" stroke="#1D68DF" stroke-width="4.5" fill="none" style="filter: drop-shadow(0px 1.5px 2px rgba(15, 23, 42, 0.15));" />

      <!-- Q group with shadow casting on O -->
      <g style="filter: drop-shadow(-2px 1.5px 2px rgba(15, 23, 42, 0.3)) drop-shadow(0px 1.5px 2px rgba(15, 23, 42, 0.15));">
        <!-- Q circle -->
        <circle cx="186" cy="33" r="13" stroke="#1D68DF" stroke-width="4.5" fill="none" />
        <!-- Wavy Q tail -->
        <path d="M 191 41 C 193 46, 196 50, 206 50" stroke="#1D68DF" stroke-width="4.5" stroke-linecap="round" fill="none" />
      </g>
    </svg>
  </div>

  <div class="container dark">
    <h3>Dark Background</h3>
    <!-- SVG Logo (Dark Version) -->
    <svg class="logo-svg" viewBox="0 0 228 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nb_g_dark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#74B9FF" />
          <stop offset="100%" stop-color="#3882F6" />
        </linearGradient>
      </defs>

      <!-- N -->
      <text x="3" y="46" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" textLength="26" lengthAdjust="spacingAndGlyphs" fill="#ffffff">N</text>

      <!-- E (House icon) with drop shadow -->
      <g style="filter: drop-shadow(0px 3px 2.5px rgba(0, 0, 0, 0.5));">
        <!-- Roof triangle -->
        <path d="M33 21 L47 4 L61 21 Z" fill="url(#nb_g_dark)" />
        <!-- Window panes -->
        <rect x="44" y="10" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="48.5" y="10" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="44" y="14.5" width="3" height="3" rx="0.5" fill="#ffffff" />
        <rect x="48.5" y="14.5" width="3" height="3" rx="0.5" fill="#ffffff" />
      </g>

      <!-- 3 bars (E body) -->
      <rect x="33" y="24" width="28" height="5" rx="2.5" fill="url(#nb_g_dark)" />
      <rect x="33" y="32" width="28" height="5" rx="2.5" fill="url(#nb_g_dark)" />
      <rect x="33" y="40" width="28" height="5" rx="2.5" fill="url(#nb_g_dark)" />

      <!-- STBL -->
      <text x="65" y="46" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" textLength="90" lengthAdjust="spacingAndGlyphs" fill="#ffffff">STBL</text>

      <!-- OQ Overlap & Shadows -->
      <!-- O circle -->
      <circle cx="169" cy="33" r="13" stroke="#3882F6" stroke-width="4.5" fill="none" style="filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.35));" />

      <!-- Q group with shadow casting on O -->
      <g style="filter: drop-shadow(-2.5px 2px 2.5px rgba(0, 0, 0, 0.5)) drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.35));">
        <!-- Q circle -->
        <circle cx="186" cy="33" r="13" stroke="#3882F6" stroke-width="4.5" fill="none" />
        <!-- Wavy Q tail -->
        <path d="M 191 41 C 193 46, 196 50, 206 50" stroke="#3882F6" stroke-width="4.5" stroke-linecap="round" fill="none" />
      </g>
    </svg>
  </div>

</body>
</html>
